<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receiver status</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f5f1; --ink:#1d2421; --muted:#66706b; --card:#fff; --line:#e3e1da; --ok:#2f7d4f; --warn:#b5651d; --accent:#0f2a22; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141917; --ink:#e9ede9; --muted:#97a39c; --card:#1c2320; --line:#2c3531; --ok:#6cc58f; --warn:#e8a25c; --accent:#9fd3b8; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .card .v { font-size:22px; font-weight:600; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 0 0 16px; }
  a, button { font: inherit; }
  button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .src { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .ctl { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:20px; }
  .ctl h2 { font-size:16px; margin:0 0 10px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .ctl h2 small { font-weight:400; font-size:13px; }
  .ctl .grp { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .ctl .grp > span:first-child { min-width:110px; color:var(--muted); font-size:13px; }
  button.on { background:var(--accent); color:var(--card); border-color:var(--accent); }
  .facts { display:flex; gap:22px; flex-wrap:wrap; margin:10px 0 6px; font-size:14px; }
  .facts b { font-variant-numeric: tabular-nums; }
  .hist { color:var(--muted); font-size:13px; margin:8px 0 0; padding-left:18px; max-height:9em; overflow:auto; }
  .bad { color: var(--warn); }
  iframe { width:100%; height: 220px; border:1px solid var(--line); border-radius:10px; background:#3a4a44; }
</style>
</head>
<body>
<main>
  <h1>Scoreboard receiver</h1>
  <p class="sub src" id="src">connecting…</p>
  <div class="row">
    <a href="/?bg=1" target="_blank">Open score bar</a>
    <a href="/?layout=board&bg=1" target="_blank">Open full board</a>
    <button id="reset" title="Clear all values (e.g. before a new match)">Clear scoreboard</button>
  </div>
  <div class="grid">
    <div class="card"><div class="k">Last message</div><div class="v" id="age">–</div></div>
    <div class="card"><div class="k">Signal above noise</div><div class="v" id="lvl">–</div></div>
    <div class="card"><div class="k">Carrier offset</div><div class="v" id="cfo">–</div></div>
    <div class="card"><div class="k">Bursts heard</div><div class="v" id="bursts">0</div></div>
  </div>
  <section class="ctl">
    <h2>Match &amp; cameras <small id="obs">–</small></h2>
    <div class="grp"><span>Batting first</span>
      <button data-api="/api/home-first" data-key="bf-home">Home</button>
      <button data-api="/api/away-first" data-key="bf-away">Away</button></div>
    <div class="grp"><span>Bowling now</span>
      <button data-api="/api/left" data-key="end-left">&#9664; Left end</button>
      <button data-api="/api/right" data-key="end-right">Right end &#9654;</button>
      <button data-api="/api/swap" title="Swap the ends if the cameras are the wrong way round">Swap ends</button></div>
    <div class="grp"><span>Scenes</span>
      <button data-api="/api/board">Show board</button>
      <button data-api="/api/live">Back to play</button>
      <button data-api="/api/auto?on=toggle" data-key="auto">Auto switching</button></div>
    <div class="facts">
      <div>Batting: <b id="batting">–</b></div>
      <div>Bowling end: <b id="bowl">–</b></div>
      <div>Camera: <b id="target">–</b></div>
      <div>On air: <b id="program">–</b></div>
    </div>
    <div id="missing" class="bad"></div>
    <ul class="hist" id="hist"></ul>
  </section>
  <iframe src="/?bg=1&scale=0.8" title="Score bar preview"></iframe>
  <h2 style="font-size:16px;margin:22px 0 8px">Recent messages</h2>
  <table><thead><tr><th>Time</th><th>Field</th><th>Value</th><th>Copies</th><th>Level</th></tr></thead><tbody id="log"></tbody></table>
</main>
<script>
function fmtAge(s){ if(s<60) return Math.round(s)+" s ago"; if(s<3600) return Math.round(s/60)+" min ago"; return Math.round(s/3600)+" h ago"; }
async function tick(){
  try{
    const r = await fetch("/log",{cache:"no-store"}); const d = await r.json(); const st = d.stats;
    document.getElementById("src").textContent = st.source || "";
    document.getElementById("bursts").textContent = st.bursts;
    const lv = st.last_level_db; const el = document.getElementById("lvl");
    el.textContent = lv==null ? "–" : lv.toFixed(0)+" dB"; el.className = "v " + (lv==null?"":(lv>=12?"ok":"warn"));
    document.getElementById("cfo").textContent = st.carrier_offset_khz==null ? "–" : st.carrier_offset_khz.toFixed(1)+" kHz";
    const lg = d.log; document.getElementById("age").textContent = lg.length ? fmtAge(d.now - lg[lg.length-1].t) : "none yet";
    document.getElementById("log").innerHTML = lg.slice().reverse().map(e =>
      `<tr><td>${new Date(e.t*1000).toLocaleTimeString()}</td><td>${e.field}: ${e.label}</td><td>${e.value||"(blank)"}</td><td>${e.copies}/10</td><td>${e.level_db==null?"–":e.level_db.toFixed(0)+" dB"}</td></tr>`).join("");
  }catch(e){ document.getElementById("src").textContent = "receiver not responding"; }
}
document.getElementById("reset").onclick = async () => { if (confirm("Clear every value on the virtual scoreboard?")) await fetch("/reset",{method:"POST"}); };
function cap(s){ return s ? s[0].toUpperCase()+s.slice(1) : "–"; }
function showDirector(d){
  const o = d.obs; const el = document.getElementById("obs");
  el.textContent = o.connected ? "OBS connected" : (o.enabled ? "OBS not connected: " + o.error : o.error);
  el.className = o.connected ? "ok" : "warn";
  document.getElementById("batting").textContent = d.batting ? cap(d.batting) + (d.second_innings ? " (2nd innings)" : " (1st innings)") : "not set";
  document.getElementById("bowl").textContent = d.bowling_end ? cap(d.bowling_end) + " end" : "not set";
  document.getElementById("target").textContent = d.target_scene || "–";
  document.getElementById("program").textContent = (d.program || "–") +
    (d.board_active ? (d.board_hold ? " (held)" : " (back in " + Math.ceil(d.board_remaining) + " s)") : "");
  document.getElementById("missing").textContent = d.missing_scenes.length ?
    "OBS has no scene called " + d.missing_scenes.map(s => "\u201c"+s+"\u201d").join(", ") + "." : "";
  const on = {"bf-home": d.batting_first==="home", "bf-away": d.batting_first==="away",
              "end-left": d.bowling_end==="left", "end-right": d.bowling_end==="right", "auto": d.auto};
  document.querySelectorAll("[data-key]").forEach(b => b.classList.toggle("on", !!on[b.dataset.key]));
  document.querySelector('[data-key="auto"]').textContent = "Auto switching: " + (d.auto ? "on" : "off");
  document.getElementById("hist").innerHTML = d.history.slice().reverse().map(h =>
    `<li>${new Date(h.t*1000).toLocaleTimeString()} ${h.text.replace(/</g,"&lt;")}</li>`).join("");
}
async function tickDirector(){
  try { showDirector(await (await fetch("/api/director",{cache:"no-store"})).json()); } catch(e) {}
}
document.querySelectorAll("[data-api]").forEach(b => b.onclick = async () => {
  try { showDirector(await (await fetch(b.dataset.api, {method:"POST"})).json()); } catch(e) {}
});
tick(); setInterval(tick, 1000);
tickDirector(); setInterval(tickDirector, 1000);
</script>
</body>
</html>
