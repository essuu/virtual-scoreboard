<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Camera</title>
<!--
  A stand-in for a camera feed, for trying the OBS switching at home.
    /testcard?end=left    blue,  "LEFT END"
    /testcard?end=right   amber, "RIGHT END"
  Options: &name=Pavilion%20End  (adds the end's name under the label)   &label=...  (override the big label)
  The clock and the moving ball show the picture is live, not frozen.
-->
<style>
  :root { --bg1:#0b2a4a; --bg2:#123f6e; --accent:#5fb4ff; --ink:#ffffff; }
  body.right { --bg1:#4a2a05; --bg2:#7a4508; --accent:#ffc04d; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg1) 70%);
    color: var(--ink); font-family: "Segoe UI", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size: min(2.2vw, 3.9vh);           /* everything scales with the source size */
  }
  .tag { letter-spacing:.4em; font-size:1.2em; opacity:.75; text-transform:uppercase; }
  .big { font-size:6.5em; font-weight:800; line-height:1; margin:.15em 0; color:var(--accent);
         text-shadow:0 .05em .2em rgba(0,0,0,.5); display:flex; align-items:center; gap:.3em; }
  .arrow { font-size:.7em; }
  .name { font-size:2.4em; font-weight:600; }
  .clock { font-family: Consolas, "Courier New", monospace; font-size:2em; margin-top:.8em;
           background:rgba(0,0,0,.35); padding:.15em .6em; border-radius:.2em; }
  .pitch { position:relative; width:28em; height:1.4em; margin-top:1.4em;
           background:#c7b07a; border-radius:.2em; box-shadow: inset 0 0 0 .12em rgba(0,0,0,.25); }
  .pitch::before, .pitch::after { content:""; position:absolute; top:-.4em; bottom:-.4em; width:.25em;
           background:#f4f0e0; }
  .pitch::before { left:1.2em; } .pitch::after { right:1.2em; }
  .ball { position:absolute; top:50%; width:1em; height:1em; margin:-.5em 0 0 -.5em; border-radius:50%;
          background:#b3121b; box-shadow: inset -.15em -.15em .2em rgba(0,0,0,.4);
          animation: bowl 2.4s ease-in infinite; }
  body.left  .ball { animation-name: bowl-ltr; }
  body.right .ball { animation-name: bowl-rtl; }
  @keyframes bowl-ltr { from { left:6%; } to { left:94%; } }
  @keyframes bowl-rtl { from { left:94%; } to { left:6%; } }
  .corner { position:fixed; top:1.2em; font-size:1.3em; font-weight:700; padding:.2em .6em;
            background:var(--accent); color:#000; border-radius:.2em; }
  body.left .corner { left:1.2em; } body.right .corner { right:1.2em; }
</style>
</head>
<body class="left">
  <div class="corner" id="corner">CAM L</div>
  <div class="tag">Test camera</div>
  <div class="big" id="big"></div>
  <div class="name" id="name"></div>
  <div class="clock" id="clock">--:--:--.-</div>
  <div class="pitch"><div class="ball"></div></div>
<script>
const q = new URLSearchParams(location.search);
const right = (q.get("end") || "left").toLowerCase().startsWith("r");
document.body.className = right ? "right" : "left";
document.title = right ? "Test Camera Right" : "Test Camera Left";
document.getElementById("corner").textContent = right ? "CAM R" : "CAM L";
const label = q.get("label") || (right ? "RIGHT END" : "LEFT END");
document.getElementById("big").innerHTML = right
  ? label + ' <span class="arrow">&#9654;</span>' : '<span class="arrow">&#9664;</span> ' + label;
const endName = document.getElementById("name");
if (q.get("name")) endName.textContent = q.get("name"); else endName.remove();
const clock = document.getElementById("clock");
const pad = n => String(n).padStart(2, "0");
function tick() {
  const d = new Date();
  clock.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) +
                      "." + Math.floor(d.getMilliseconds() / 100);
}
tick(); setInterval(tick, 100);
</script>
</body>
</html>
